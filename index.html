<!DOCTYPE html>

    <title>Tic Tac Toe</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* Added for better box model handling */
        }
        body{
            width: 100%;
            min-height: 100vh; /* Changed height to min-height for better responsiveness */
            display: flex;
            flex-direction: column;
            /* justify-content: center; */ /* Commented out in original, keeping as is */
            align-items: center;
            flex-wrap: wrap;
            background-color: #1e293b;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            padding-top: 20px; /* Added some padding to the top */
        }
        #grid{
            width: 300px;
            height: 300px;
            display: grid;
            grid-template-rows: repeat(3, 1fr); /* Use repeat and 1fr for flexibility */
            grid-template-columns: repeat(3, 1fr); /* Use repeat and 1fr for flexibility */
            margin-top: 20px; /* Added margin-top */
            margin-bottom: 20px; /* Added margin-bottom */
        }
        .items{
           border: 2px solid #cbdaf1;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;
            transition: all 0.4s ease-in-out; /* Combined transition properties */
        }
        /* Simplified border removal using nth-child or grid properties is possible,
           but keeping original ID-based approach as it was present.
           A more robust CSS approach would be better but outside the scope
           of improving HTML logic. */
        #item1,#item2,#item3{
            border-top: none;
        }
        #item1,#item4,#item7{
            border-left: none;
        }
        #item3,#item6,#item9{
            border-right: none;
        }
        #item7,#item8,#item9{
            border-bottom: none;
        }
        .items:hover{
            background-color: #cbdaf1;
            color: #1e293b;
        }
        .btn{
            margin-top: 30px;
            margin-bottom: 30px;
            width: 100px;
            height: 50px;
            background-color: transparent;
            border: none;
            font-size: 25px;
            color: white;
            transition: all 0.2s ease-in-out; /* Combined transition properties */
            border : 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer; /* Added cursor pointer */
        }
        #btnx{
            margin-right: 20px;
            background-color: #e2e8f0;
            color: black;
        }
        .play{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 22px;
            margin-top: 20px;
            width: 160px;
            height: 45px;
            display: none; /* Initially hidden */
            cursor: pointer;
            transition: all 0.3s ease-in-out; /* Combined transition properties */
            background-color: #e2e8f0; /* Added background */
            color: #1e293b; /* Added text color */
            border: none; /* Added border none */
            border-radius: 8px; /* Added border radius */
        }
        .play:hover{
            width: 200px;
        }
        #won{
            margin-top: 20px;
            color: #ffffff;
            text-align: center; /* Added text-align */
        }

</head>
