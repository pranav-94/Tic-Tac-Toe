<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* Added for better box model */
        }
        body{
            width: 100%;
            min-height: 100vh; /* Use min-height for better responsiveness */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Center content vertically */
            background-color: #1e293b;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            padding: 20px; /* Add some padding */
        }
        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 40px; /* Added font size */
        }
        .player-choice { /* Wrapper for player choice buttons */
            margin-bottom: 30px;
        }
        #grid{
            width: 300px;
            height: 300px;
            display: grid;
            grid-template-rows: repeat(3, 1fr); /* Use 1fr for flexible sizing */
            grid-template-columns: repeat(3, 1fr); /* Use 1fr for flexible sizing */
            gap: 0; /* Ensure no gap between grid items */
            border: 2px solid #cbdaf1; /* Add border to the grid container */
        }
        .items{
            border: 2px solid #cbdaf1;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;
            transition: background-color 0.4s ease-in-out, color 0.4s ease-in-out; /* Specify transitions */
        }
        /* Remove individual border styles and rely on grid container border and item borders */
        .items:nth-child(1), .items:nth-child(2), .items:nth-child(3) { border-top: none; }
        .items:nth-child(1), .items:nth-child(4), .items:nth-child(7) { border-left: none; }
        .items:nth-child(3), .items:nth-child(6), .items:nth-child(9) { border-right: none; }
        .items:nth-child(7), .items:nth-child(8), .items:nth-child(9) { border-bottom: none; }


        .items:hover{
            background-color: #cbdaf1;
            color: #1e293b;
        }
        .btn{
            margin: 0 10px; /* Adjusted margin */
            width: 100px;
            height: 50px;
            background-color: transparent;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 25px;
            color: white;
            cursor: pointer; /* Added cursor */
            transition: background-color 0.2s ease-in-out, color 0.2s ease-in-out; /* Specify transitions */
        }
        #btnx{
             /* Removed margin-right */
            background-color: #e2e8f0;
            color: black;
        }
         #btno {
             /* Removed margin-left */
         }
        .btn:hover {
            opacity: 0.9; /* Add hover effect */
        }
        .play{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 22px;
            margin-top: 30px; /* Adjusted margin */
            width: 160px;
            height: 45px;
            display: none; /* Initially hidden */
            cursor: pointer;
            background-color: #e2e8f0; /* Added background */
            color: #1e293b; /* Added text color */
            border: none; /* Removed border */
            border-radius: 8px; /* Added border-radius */
            transition: width 0.3s ease-in-out; /* Specify transition */
        }
        .play:hover{
            width: 200px;
        }
        #won{
            margin-top: 20px;
            color: #ffffff;
            font-size: 30px; /* Moved font-size from inline style */
            text-align: center; /* Center text */
        }
         @media all and (max-width: 600px){
            body{
                padding: 10px; /* Adjust padding */
            }
            h1 {
                font-size: 30px; /* Adjust font size */
            }
            #grid{
                width: 90vw; /* Use viewport width */
                height: 90vw; /* Keep aspect ratio */
                max-width: 300px; /* Max size */
                max-height: 300px; /* Max size */
                margin-top: 20px;
                margin-bottom: 30px;
            }
            .items {
                font-size: 15vw; /* Responsive font size */
                max-font-size: 50px; /* Max font size */
            }
            .btn {
                width: 80px; /* Adjust button size */
                height: 40px;
                font-size: 20px;
            }
            .play {
                width: 140px; /* Adjust play button size */
                height: 40px;
                font-size: 20px;
            }
            .play:hover {
                width: 160px; /* Adjust hover size */
            }
            #won {
                font-size: 24px; /* Adjust font size */
            }
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1> <!-- Added main heading -->
    <div class="player-choice"> <!-- Wrapper for player choice buttons -->
        <button class="btn" id="btnx">X</button>
        <button class="btn" id="btno">O</button>
    </div>
    <div id="grid">
         <!-- Added data-index attributes for easier JavaScript logic -->
         <div class="items" id="item1" data-index="0"></div>

         <div class="items" id="item4" data-index="3"></div>
         <div class="items" id="item5" data-index="4"></div>
         <div class="items" id="item6" data-index="5"></div>

         <div class="items" id="item8" data-index="7"></div>
         <div class="items" id="item9" data-index="8"></div>
    </div>
    <p id="won"></p> <!-- Removed inline style -->
    <button class="play">Play Again</button>
</body>
<script src="script.js"></script>
</html>
