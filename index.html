<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* Added for consistent sizing */
        }
        body{
            width: 100%;
            min-height: 100vh; /* Ensure body fills viewport height */
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1e293b; 
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        #grid{
            width: 300px;
            height: 300px;
            display: grid;
            grid-template-rows: repeat(3, 100px); /* Improved grid definition */
            grid-template-columns: repeat(3, 100px);
            gap: 2px; /* Added gap for better visual separation */
        }
        .items{
           border: 2px solid #cbdaf1;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-family: inherit; /* Inherit font-family from body */
            color: white;
            transition: all 0.4s ease-in-out; /* Simplified transition */
        }
        .items:hover{
            background-color: #cbdaf1;
            color: #1e293b;
        }
        .btn{
            margin: 30px 20px 0 0; /* Adjusted margin for better layout */
            width: 100px;
            height: 50px;
            background-color: transparent;
            border: none;
            font-size: 25px;
            color: white;
            transition: all 0.2s ease-in-out; /* Simplified transition */
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer; /* Added cursor style */
        }
        #btnx{
            background-color: #e2e8f0;
            color: black;
        }
        .play{
            font-family: inherit; /* Inherit font-family from body */
            font-size: 22px;
            margin-top: 20px;
            width: 160px;
            height: 45px;
            display: none;
            cursor: pointer;
            transition: width 0.3s ease-in-out; /* Simplified transition */
            border: none; /* Removed unnecessary border */
            background-color: transparent; /* Ensure background is transparent */
            color: white; /* Ensure text color is visible */
            border: 2px solid #e2e8f0; /* Added border for better visibility */
            border-radius: 8px; /* Added rounded corners */
        }
        .play:hover{
            width: 200px;
        }
        #won{
            margin-top: 20px;
            color: #ffffff;
            font-size: 30px; /* Added font size for consistency */
        }
        @media (max-width: 600px){
            body{
                height: 100vh; /* Ensure body fills viewport height */
            }
            #grid{
                margin-top: 20px;
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <div>
        <button class="btn" id="btnx">X</button>
        <button class="btn" id="btno">O</button>
    </div>
    <div id="grid">
         <div class="items" id="item1"></div>
         <div class="items" id="item2"></div>
         <div class="items" id="item3"></div>
         <div class="items" id="item4"></div>
         <div class="items" id="item5"></div>
         <div class="items" id="item6"></div>
         <div class="items" id="item7"></div>
         <div class="items" id="item8"></div>
         <div class="items" id="item9"></div>
    </div>
    <p id="won"></p>
    <button class="play">Play Again</button>
</body>
<script src="script.js"></script>
</html>
