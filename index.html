<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* Added for better box model handling */
        }
        body{
            width: 100%;
            min-height: 100vh; /* Use min-height for better responsiveness */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Center content vertically */
            background-color: #1e293b;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            padding: 20px; /* Add some padding */
        }
        #grid{
            width: 300px;
            height: 300px;
            display: grid;
            grid-template-rows: repeat(3, 1fr); /* Use repeat and fr for flexible sizing */
            grid-template-columns: repeat(3, 1fr); /* Use repeat and fr for flexible sizing */
            margin-top: 20px; /* Add margin */
            margin-bottom: 20px; /* Add margin */
        }
        .items{
            border: 2px solid #cbdaf1;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;
            transition: background-color 0.4s ease-in-out, color 0.4s ease-in-out; /* Specify properties for transition */
        }
        /* Use nth-child for border styling based on grid position */
        #grid .items:nth-child(-n+3) { border-top: none; } /* First row */
        #grid .items:nth-child(3n+1) { border-left: none; } /* First column */
        #grid .items:nth-child(3n+3) { border-right: none; } /* Third column */
        #grid .items:nth-child(n+7) { border-bottom: none; } /* Third row */

        .items:hover{
            background-color: #cbdaf1;
            color: #1e293b;
        }
        .btn-container { /* Wrap buttons in a container */
            margin-bottom: 20px;
        }
        .btn{
            width: 100px;
            height: 50px;
            background-color: transparent;
            border: none;
            font-size: 25px;
            color: white;
            transition: all 0.2s ease-in-out; /* Specify properties for transition */
            border : 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer; /* Add cursor pointer */
        }
        #btnx{
            margin-right: 20px;
            background-color: #e2e8f0;
            color: black;
        }
        .play{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 22px;
            margin-top: 20px;
            width: 160px;
            height: 45px;
            display: none; /* Initially hidden */
            cursor: pointer;
            transition: width 0.3s ease-in-out; /* Specify property for transition */
            border: 2px solid #e2e8f0; /* Add border for consistency */
            background-color: transparent; /* Ensure transparent background */
            color: white; /* Ensure white text */
            border-radius: 8px; /* Add border radius */
        }
        .play:hover{
            width: 200px;
        }
        #won{
            margin-top: 20px;
            color: #ffffff;
            font-size: 30px; /* Moved font-size from inline style */
            text-align: center; /* Center text */
        }
         @media all and (max-width: 600px){
            body{
                min-height: 100vh; /* Keep min-height */
                padding: 10px; /* Adjust padding */
            }
            #grid{
                width: 90vw; /* Use relative units */
                height: 90vw; /* Use relative units */
                max-width: 300px; /* Set max width */
                max-height: 300px; /* Set max height */
                margin-top: 20px;
                margin-bottom: 20px;
            }
            .items {
                font-size: 15vw; /* Adjust font size based on viewport width */
                max-font-size: 50px; /* Set max font size */
            }
            .btn {
                width: 80px; /* Adjust button size */
                height: 40px;
                font-size: 20px;
            }
            #btnx {
                margin-right: 10px; /* Adjust margin */
            }
            .play {
                width: 140px; /* Adjust play button size */
                height: 40px;
                font-size: 20px;
            }
            .play:hover {
                width: 160px; /* Adjust hover size */
            }
            #won {
                font-size: 24px; /* Adjust font size */
            }
        }
    </style>
</head>
<body>
<div class="btn-container">
    <button class="btn" id="btnx">X</button>
    <button class="btn" id="btno">O</button>
</div>
    <div id="grid">
         <!-- Using data-index for easier mapping to array in JS -->
         <div class="items" data-index="0"></div>
         <div class="items" data-index="1"></div>
         <div class="items" data-index="2"></div>
         <div class="items" data-index="3"></div>
         <div class="items" data-index="4"></div>
         <div class="items" data-index="5"></div>
         <div class="items" data-index="6"></div>
         <div class="items" data-index="7"></div>
         <div class="items" data-index="8"></div>
    </div>
    <p id="won"></p>
    <button class="play">Play Again</button>
</body>
<script src="script.js"></script>
</html>
