<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* Added for better box model handling */
        }
        body{
            width: 100%;
            min-height: 100vh; /* Use min-height for better responsiveness */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Center content vertically */
            background-color: #1e293b;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            padding: 20px; /* Add some padding */
        }
        #grid{
            width: 300px;
            height: 300px;
            display: grid;
            grid-template-rows: repeat(3, 1fr); /* Use repeat and fr units for flexibility */
            grid-template-columns: repeat(3, 1fr); /* Use repeat and fr units for flexibility */
            border: 2px solid #cbdaf1; /* Add border to grid container */
        }
        .items{
            border: 2px solid #cbdaf1;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;
            transition: background-color 0.4s ease-in-out, color 0.4s ease-in-out; /* Specify properties for transition */
        }
        /* Remove individual border styles, use grid gap or border on container/items */
        /* The grid border and item borders handle separation */
        #grid .items:nth-child(1),
        #grid .items:nth-child(2),
        #grid .items:nth-child(3) { border-top: none; }
        #grid .items:nth-child(1),
        #grid .items:nth-child(4),
        #grid .items:nth-child(7) { border-left: none; }
        #grid .items:nth-child(3),
        #grid .items:nth-child(6),
        #grid .items:nth-child(9) { border-right: none; }
        #grid .items:nth-child(7),
        #grid .items:nth-child(8),
        #grid .items:nth-child(9) { border-bottom: none; }


        .items:hover{
            background-color: #cbdaf1;
            color: #1e293b;
        }
        .btn-container { /* Added container for buttons */
            margin-bottom: 30px;
        }
        .btn{
            width: 100px;
            height: 50px;
            background-color: transparent;
            border: none;
            font-size: 25px;
            color: white;
            transition: all 0.2s ease-in-out; /* Specify properties for transition */
            border : 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer; /* Add cursor pointer */
        }
        #btnx{
            margin-right: 20px;
            /* Initial active state handled by JS */
        }
         #btno {
             /* Initial state */
         }
        .btn.active { /* Class to indicate active player choice */
            background-color: #e2e8f0;
            color: black;
        }

        .play{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 22px;
            margin-top: 20px;
            width: 160px;
            height: 45px;
            display: none; /* Initially hidden */
            cursor: pointer;
            transition: width 0.3s ease-in-out; /* Specify property for transition */
            background-color: #e2e8f0; /* Added background */
            color: #1e293b; /* Added text color */
            border: none; /* Remove default border */
            border-radius: 8px; /* Add border radius */
        }
        .play:hover{
            width: 200px;
        }
        #won{
            margin-top: 20px;
            color: #ffffff;
            font-size: 30px; /* Moved font-size from inline style */
            text-align: center; /* Center text */
            min-height: 1.2em; /* Reserve space to prevent layout shifts */
        }
         @media all and (max-width: 600px){
            body{
                padding: 10px; /* Adjust padding */
            }
            #grid{
                margin-top: 20px;
                margin-bottom: 30px;
                width: 90vw; /* Make grid responsive */
                height: 90vw; /* Make grid responsive */
                max-width: 300px; /* Keep max size */
                max-height: 300px; /* Keep max size */
            }
             .items {
                 font-size: 15vw; /* Make font size responsive */
                 max-font-size: 50px; /* Keep max font size */
             }
             .btn-container {
                 display: flex; /* Arrange buttons side-by-side */
                 justify-content: center;
                 width: 100%;
                 margin-bottom: 20px;
             }
             .btn {
                 width: 45%; /* Make buttons responsive */
                 max-width: 100px; /* Keep max width */
             }
             #btnx {
                 margin-right: 10px; /* Adjust margin */
             }
             #btno {
                 margin-left: 10px; /* Adjust margin */
             }
             #won {
                 font-size: 6vw; /* Make font size responsive */
                 max-font-size: 30px; /* Keep max font size */
             }
             .play {
                 width: 60%; /* Make play button responsive */
                 max-width: 160px; /* Keep max width */
                 font-size: 5vw; /* Make font size responsive */
                 max-font-size: 22px; /* Keep max font size */
             }
             .play:hover {
                 width: 65%; /* Adjust hover width */
                 max-width: 200px; /* Keep max width */
             }
        }
    </style>
</head>
