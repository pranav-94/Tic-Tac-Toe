    <style>
        *{
            margin: 0;

            grid-template-columns: repeat(3, 1fr); /* Use repeat and fr units for flexibility */
            border: 2px solid #cbdaf1; /* Add a border around the grid */
        }
        .items{
           /* border: 2px solid #cbdaf1; */ /* Removed individual borders */
            border: 1px solid #cbdaf1; /* Use 1px border for grid lines */

            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;
            transition: all 0.4s ease-in-out; /* Combined transition properties */

            color: #1e293b; /* Added text color */

        }

            width: 200px;
        }

        }

            }
        }
    </style>
</head>
