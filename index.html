<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* Added for better box model handling */
        }
        body{
            width: 100%;
            min-height: 100vh; /* Use min-height for better responsiveness */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Center content vertically */
            flex-wrap: wrap;
            background-color: #1e293b;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            padding: 20px; /* Add some padding */
        }
        #grid{
            width: 300px;
            height: 300px;
            display: grid;
            grid-template-rows: repeat(3, 1fr); /* Use repeat and 1fr for flexibility */
            grid-template-columns: repeat(3, 1fr); /* Use repeat and 1fr for flexibility */
            margin-top: 20px; /* Added margin */
            margin-bottom: 20px; /* Added margin */
        }
        .items{
           border: 2px solid #cbdaf1;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;
            transition: all 0.4s ease-in-out; /* Combined transition properties */
        }
        /* Specific border removal - could be simplified with grid gap or different border strategy */
        #item1,#item2,#item3{ border-top: none; }
        #item1,#item4,#item7{ border-left: none; }
        #item3,#item6,#item9{ border-right: none; }
        #item7,#item8,#item9{ border-bottom: none; }

        .items:hover{
            background-color: #cbdaf1;
            color: #1e293b;
        }
        .btn-container { /* Added container for buttons */
            margin-bottom: 20px;
        }
        .btn{
            width: 100px;
            height: 50px;
            background-color: transparent;
            border: none;
            font-size: 25px;
            color: white;
            transition: all 0.2s ease-in-out; /* Combined transition properties */
            border : 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer; /* Added cursor */
        }
        #btnx{
            margin-right: 20px;
            background-color: #e2e8f0;
            color: black;
        }
        .game-status { /* Added container for status and play again */
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        #won{
            font-size: 30px; /* Moved inline style to CSS */
            color: #ffffff;
            margin-bottom: 20px; /* Added margin below status */
        }
        .play{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 22px;
            width: 160px;
            height: 45px;
            display: none; /* Initially hidden */
            cursor: pointer;
            transition: all 0.3s ease-in-out; /* Combined transition properties */
            background-color: #e2e8f0; /* Added background */
            color: #1e293b; /* Added text color */
            border: none; /* Removed border */
            border-radius: 8px; /* Added border-radius */
        }
        .play:hover{
            width: 200px;
        }
         @media all and (max-width: 600px){
            body{
                padding: 10px; /* Adjust padding */
            }
            #grid{
                width: 90vw; /* Use viewport width */
                height: 90vw; /* Use viewport width to maintain aspect ratio */
                max-width: 300px; /* Keep max width */
                max-height: 300px; /* Keep max height */
            }
            .items {
                font-size: 15vw; /* Adjust font size based on viewport */
                max-font-size: 50px; /* Keep max font size */
            }
            .btn {
                width: 80px; /* Adjust button size */
                height: 40px;
                font-size: 20px;
            }
            #btnx {
                margin-right: 10px; /* Adjust margin */
            }
            #won {
                font-size: 24px; /* Adjust font size */
            }
            .play {
                width: 140px; /* Adjust button size */
                height: 40px;
                font-size: 20px;
            }
            .play:hover {
                width: 160px; /* Adjust hover size */
            }
        }
    </style>
</head>
<body>
<div class="btn-container"> <!-- Wrapped buttons in a container -->

    <button class="btn" id="btno">O</button>
</div>
    <div id="grid">
         <div class="items" id="item1" data-cell-index="0"></div>

    </div>
    <div class="game-status"> <!-- Wrapped status and play again in a container -->

    </div>

</html>
