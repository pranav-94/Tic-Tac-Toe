<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* Include padding and border in element's total width and height */
        }
        body{
            width: 100%;
            min-height: 100vh; /* Use min-height for full viewport height */
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1e293b;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            padding: 20px; /* Add some padding */
        }
        #grid{
            width: 300px;
            height: 300px;
            display: grid;
            grid-template-rows: repeat(3, 1fr); /* Use 1fr for flexible sizing */
            grid-template-columns: repeat(3, 1fr); /* Use 1fr for flexible sizing */
            margin-top: 20px; /* Add margin */
            margin-bottom: 20px; /* Add margin */
        }
        .items{
           border: 2px solid #cbdaf1;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;
            transition: all 0.4s ease-in-out; /* Combined transition properties */
        }
        /* More robust border removal using grid position */
