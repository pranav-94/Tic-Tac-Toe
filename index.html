<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* Added for better box model handling */
        }
        body{
            width: 100%;
            min-height: 100vh; /* Use min-height for better responsiveness */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Center content vertically */
            background-color: #1e293b;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            padding: 20px; /* Add some padding */
        }
        .game-container { /* Added container for better structure */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px; /* Space between elements */
        }
        .player-selection { /* Added container for buttons */
            display: flex;
            gap: 20px; /* Space between buttons */
            margin-bottom: 20px; /* Space below buttons */
        }
        #grid{
            width: 300px;
            height: 300px;
            display: grid;
            grid-template-rows: repeat(3, 1fr); /* Use fr units for flexibility */
            grid-template-columns: repeat(3, 1fr); /* Use fr units for flexibility */
            border: 2px solid #cbdaf1; /* Add border to grid container */
        }
        .items{
            border: 2px solid #cbdaf1;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;
            transition: background-color 0.4s ease-in-out, color 0.4s ease-in-out; /* Combined transitions */
        }
        /* Simplified border styles using grid properties */
        #grid .items:nth-child(1),
        #grid .items:nth-child(2),
        #grid .items:nth-child(3) {
            border-top: none;
        }
        #grid .items:nth-child(1),
        #grid .items:nth-child(4),
        #grid .items:nth-child(7) {
            border-left: none;
        }
        #grid .items:nth-child(3),
        #grid .items:nth-child(6),
        #grid .items:nth-child(9) {
            border-right: none;
        }
        #grid .items:nth-child(7),
        #grid .items:nth-child(8),
        #grid .items:nth-child(9) {
            border-bottom: none;
        }

        .items:hover{
            background-color: #cbdaf1;
            color: #1e293b;
        }
        .btn{
            width: 100px;
            height: 50px;
            background-color: transparent;
            border: 2px solid #e2e8f0; /* Consistent border */
            font-size: 25px;
            color: white;
            transition: background-color 0.2s ease-in-out, color 0.2s ease-in-out; /* Combined transitions */
            border-radius: 8px;
            cursor: pointer; /* Added cursor */
        }
        #btnx{
            background-color: #e2e8f0;
            color: black;
        }
        .play{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 22px;
            width: 160px;
            height: 45px;
            display: none; /* Initially hidden */
            cursor: pointer;
            transition: width 0.3s ease-in-out; /* Transition only width */
            background-color: #e2e8f0; /* Added background */
            color: #1e293b; /* Added text color */
            border: none; /* Removed border */
            border-radius: 8px; /* Added border-radius */
        }
        .play:hover{
            width: 200px;
        }
        #won{
            color: #ffffff;
            text-align: center; /* Center the text */
        }
         @media all and (max-width: 600px){
            body{
                padding: 10px; /* Adjust padding */
            }
            .game-container {
                gap: 15px; /* Adjust gap */
            }
            .player-selection {
                 gap: 15px; /* Adjust gap */
                 margin-bottom: 15px; /* Adjust margin */
            }
            #grid{
                width: 270px; /* Adjust grid size */
                height: 270px; /* Adjust grid size */
            }
            .items {
                font-size: 40px; /* Adjust font size */
            }
            .btn {
                width: 80px; /* Adjust button size */
                height: 40px; /* Adjust button size */
                font-size: 20px; /* Adjust font size */
            }
            .play {
                width: 140px; /* Adjust button size */
                height: 40px; /* Adjust button size */
                font-size: 20px; /* Adjust font size */
            }
            .play:hover {
                width: 170px; /* Adjust hover size */
            }
            #won {
                font-size: 25px !important; /* Adjust font size */
            }
        }
    </style>
</head>
