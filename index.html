<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* Added for better box model handling */
        }
        body{
            width: 100%;
            min-height: 100vh; /* Use min-height for better responsiveness */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Center content vertically */
            align-items: center;
            background-color: #1e293b;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            padding: 20px; /* Add some padding */
        }
        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 40px; /* Added style for the heading */
        }
        #grid{
            width: 300px;
            height: 300px;
            display: grid;
            grid-template-rows: repeat(3, 1fr); /* Use fr units for flexible sizing */
            grid-template-columns: repeat(3, 1fr); /* Use fr units for flexible sizing */
            gap: 0; /* Ensure no gap between grid items */
            border: 2px solid #cbdaf1; /* Add border to the grid container */
        }
        .items{
            /* Removed individual borders, using grid container border and item borders */
            border: 1px solid #cbdaf1; /* Add border to items */
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;
            transition: background-color 0.4s ease-in-out, color 0.4s ease-in-out; /* Specify transitions */
        }
        /* Removed specific border styles for items as grid border and item borders handle it */
        #item1 { border-top: none; border-left: none; }
        #item2 { border-top: none; }
        #item3 { border-top: none; border-right: none; }
        #item4 { border-left: none; }
        #item6 { border-right: none; }
        #item7 { border-bottom: none; border-left: none; }
        #item8 { border-bottom: none; }
        #item9 { border-bottom: none; border-right: none; }


        .items:hover{
            background-color: #cbdaf1;
            color: #1e293b;
        }
        .btn{
            margin-top: 30px;
            margin-bottom: 30px;
            width: 100px;
            height: 50px;
            background-color: transparent;
            border: none;
            font-size: 25px;
            color: white;
            transition: all 0.2s ease-in-out; /* Specify transitions */
            border : 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer; /* Added cursor pointer */
        }
        #btnx{
            margin-right: 20px;
            background-color: #e2e8f0;
            color: black;
        }
        .play{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 22px;
            margin-top: 20px;
            width: 160px;
            height: 45px;
            display: none; /* Initially hidden */
            cursor: pointer;
            transition: width 0.3s ease-in-out; /* Specify transitions */
            background-color: #e2e8f0; /* Added background */
            color: #1e293b; /* Added text color */
            border: none; /* Removed default border */
            border-radius: 8px; /* Added border radius */
        }
        .play:hover{
            width: 200px;
        }
        #won{
            margin-top: 20px;
            color: #ffffff;
            font-size: 30px; /* Moved font-size from inline style */
            text-align: center; /* Center the text */
        }
         @media all and (max-width: 600px){
            body{
                /* height: 1000px; Removed fixed height */
                min-height: 100vh; /* Ensure full height on small screens */
                justify-content: flex-start; /* Align items to the top on small screens */
                padding-top: 20px;
            }
            h1 {
                font-size: 30px; /* Adjust heading size */
            }
            #grid{
                margin-top: 20px;
                margin-bottom: 30px;
                width: 90%; /* Make grid responsive */
                height: auto; /* Allow height to adjust */
                max-width: 300px; /* Max width */
            }
            .items {
                font-size: 40px; /* Adjust item font size */
            }
            .btn {
                width: 80px; /* Adjust button width */
                height: 40px; /* Adjust button height */
                font-size: 20px; /* Adjust button font size */
            }
            .play {
                 width: 140px; /* Adjust play button width */
                 height: 40px; /* Adjust play button height */
                 font-size: 20px; /* Adjust play button font size */
            }
             .play:hover{
                width: 160px; /* Adjust play button hover width */
            }
            #won {
                font-size: 24px; /* Adjust won message font size */
            }
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1> <!-- Added a main heading -->
    <div>
        <button class="btn" id="btnx">X</button>
        <button class="btn" id="btno">O</button>
    </div>
    <div id="grid">
         <!-- Added data-index attributes for easier JavaScript logic -->
         <div class="items" id="item1" data-index="0"></div>
         <div class="items" id="item2" data-index="1"></div>
         <div class="items" id="item3" data-index="2"></div>
         <div class="items" id="item4" data-index="3"></div>
         <div class="items" id="item5" data-index="4"></div>
         <div class="items" id="item6" data-index="5"></div>
         <div class="items" id="item7" data-index="6"></div>
         <div class="items" id="item8" data-index="7"></div>
         <div class="items" id="item9" data-index="8"></div>
    </div>
    <p id="won"></p> <!-- Removed inline style -->
    <button class="play">Play Again</button>
</body>

</html>
