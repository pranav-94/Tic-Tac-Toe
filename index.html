<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        :root {
            --primary-color: #1e293b;
            --secondary-color: #cbdaf1;
            --text-color: white;
        }
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--primary-color);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        #grid {
            width: 300px;
            height: 300px;
            display: grid;
            grid-template-rows: repeat(3, 100px);
            grid-template-columns: repeat(3, 100px);
            gap: 2px;
        }
        .items {
            border: 2px solid var(--secondary-color);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            color: var(--text-color);
            transition: background-color 0.4s ease-in-out, color 0.4s ease-in-out;
        }
        .items:hover {
            background-color: var(--secondary-color);
            color: var(--primary-color);
        }
        .btn {
            margin: 30px 20px;
            width: 100px;
            height: 50px;
            background-color: transparent;
            border: none;
            font-size: 25px;
            color: var(--text-color);
            transition: background-color 0.2s ease-in-out, color 0.2s ease-in-out;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
        }
        #btnx {
            background-color: #e2e8f0;
            color: black;
        }
        .play {
            font-family: inherit;
            font-size: 22px;
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            background-color: var(--secondary-color);
            color: var(--primary-color);
            cursor: pointer;
            transition: width 0.3s ease-in-out;
            border-radius: 8px;
            display: none;
        }
        .play:hover {
            width: 200px;
        }
        #won {
            margin-top: 20px;
            font-size: 30px;
            color: var(--text-color);
        }
        @media (max-width: 600px) {
            body {
                height: 1000px;
            }
            #grid {
                margin-top: 20px;
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <div>
        <button class="btn" id="btnx">X</button>
        <button class="btn" id="btno">O</button>
    </div>
    <div id="grid">
        <div class="items" id="item1"></div>
        <div class="items" id="item2"></div>
        <div class="items" id="item3"></div>
        <div class="items" id="item4"></div>
        <div class="items" id="item5"></div>
        <div class="items" id="item6"></div>
        <div class="items" id="item7"></div>
        <div class="items" id="item8"></div>
        <div class="items" id="item9"></div>
    </div>
    <p id="won"></p>
    <button class="play">Play Again</button>
    <script src="script.js"></script>
</body>
</html>
