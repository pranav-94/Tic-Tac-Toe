<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        *, ::before, ::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* Inherit box-sizing for better layout control */
        }
        body{
            width: 100%;
            min-height: 100vh; /* Use min-height for better viewport adaptability */
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1e293b; 
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        #grid{
            width: 300px;
            height: 300px;
            display: grid;
            grid-template-rows: repeat(3, 100px); /* Use repeat for conciseness */
            grid-template-columns: repeat(3, 100px);
        }
        .items{
            border: 2px solid #cbdaf1;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-family: inherit; /* Inherit font-family from body */
            color: white;
            transition: background-color 0.4s ease-in-out, color 0.4s ease-in-out; /* Improved transition declaration */
        }
        .items:hover{
            background-color: #cbdaf1;
            color: #1e293b;
        }
        .items:nth-child(-n+3){ /* Use CSS nth-child for better selector */
            border-top: none;
        }
        .items:nth-child(3n+1){
            border-left: none;
        }
        .items:nth-child(3n){
            border-right: none;
        }
        .items:nth-child(n+7){
            border-bottom: none;
        }
        .btn{
            margin: 30px 20px; /* Combine margin declarations */
            width: 100px;
            height: 50px;
            background-color: transparent;
            border: none;
            font-size: 25px;
            color: white;
            transition: background-color 0.2s ease-in-out, color 0.2s ease-in-out; /* Improved transition declaration */
            border: 2px solid #e2e8f0;
            border-radius: 8px;
        }
        #btnx{
            background-color: #e2e8f0;
            color: black;
        }
        .play{
            font-family: inherit; /* Inherit font-family from body */
            font-size: 22px;
            margin-top: 20px;
            width: 160px;
            height: 45px;
            display: none;
            cursor: pointer;
            transition: width 0.3s ease-in-out; /* Improved transition declaration */
        }
        .play:hover{
            width: 200px;
        }
        #won{
            margin-top: 20px;
            color: #ffffff;
            font-size: 30px; /* Moved inline style to here */
        }
        @media (max-width: 600px){ /* Simplified media query */
            body{
                min-height: 100vh; /* Maintain min-height on smaller screens */
            }
            #grid{
                margin-top: 20px;
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <div>
        <button class="btn" id="btnx">X</button>
        <button class="btn" id="btno">O</button>
    </div>
    <div id="grid">
        <div class="items" id="item1"></div>
        <div class="items" id="item2"></div>
        <div class="items" id="item3"></div>
        <div class="items" id="item4"></div>
        <div class="items" id="item5"></div>
        <div class="items" id="item6"></div>
        <div class="items" id="item7"></div>
        <div class="items" id="item8"></div>
        <div class="items" id="item9"></div>
    </div>
    <p id="won"></p>
    <button class="play">Play Again</button>
    <script src="script.js"></script>
</body>
</html>
